name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin
        run: claude plugin validate --strict ./helpbento
      - name: Validate marketplace
        run: claude plugin validate --strict .

  # TODO(post-deploy): add a connect smoke test against the deployed MCP origin
  # (fetch /.well-known/oauth-authorization-server and tools/list) once the
  # backend is live at api.helpbento.com — until then there is no reachable
  # origin to smoke-test.
