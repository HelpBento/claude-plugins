name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin
        run: claude plugin validate --strict ./helpbento
      - name: Validate marketplace
        run: claude plugin validate --strict .

  # TODO: add a connect smoke test against the deployed MCP origin — fetch
  # https://mcp.helpbento.com/.well-known/oauth-authorization-server and assert
  # it advertises a registration_endpoint. The old blocker (no reachable
  # backend) is gone: the origin went live 2026-09-18. Note tools/list can NOT
  # be part of it — /mcp requires a bearer token, so an unauthenticated CI run
  # only ever gets a 401 challenge.
